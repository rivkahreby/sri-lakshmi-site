<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Sri Lakshmi Mobile Service Center</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .not-found h1 { font-size: 4rem; color: var(--accent-yellow); margin-bottom: 8px; }
    .not-found p { color: var(--text-muted); margin-bottom: 24px; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="not-found">
    <h1>404</h1>
    <p>This page doesn't exist. Let's get you back on track.</p>
    <a href="/" class="btn-primary">Back to Home</a>
  </div>
  <script src="js/bgCanvas.js"></script>
</body>
</html>
